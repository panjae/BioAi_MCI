<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>LT 대화 시뮬레이터 (HF 기반 6유형 상담)</title>
<style>
    body {
        font-family: "Segoe UI", sans-serif;
        background: #f3f6fc;
        padding: 40px;
        color: #222;
    }
    .container {
        max-width: 960px;
        margin: auto;
        background: #fff;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 4px;
    }
    .sub {
        font-size: 15px;
        color: #666;
        margin-bottom: 24px;
    }
    .select-box {
        padding: 16px;
        margin: 20px 0;
        border-radius: 12px;
        background: #eef3ff;
    }
    button {
        padding: 12px 20px;
        border: none;
        background: #4a6bff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 12px;
    }
    button:hover {
        background: #3955d8;
    }
    .choice-btn {
        display: block;
        width: 100%;
        text-align: left;
        margin: 8px 0;
        padding: 14px;
        background: #fafafa;
        border: 1px solid #ddd;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
    }
    .choice-btn:hover {
        background: #f0f3ff;
        border-color: #4a6bff;
    }
    .bubble-user {
        text-align: right;
        margin: 16px 0;
    }
    .bubble-user span {
        display: inline-block;
        background: #4a6bff;
        color: white;
        padding: 12px 18px;
        border-radius: 18px;
    }
    .bubble-bot {
        text-align: left;
        margin: 16px 0;
    }
    .bubble-bot span {
        display: inline-block;
        background: #eef1ff;
        padding: 12px 18px;
        border-radius: 18px;
    }
</style>

<script>
//////////////////////////////////////
// 1) 유형 데이터 정의
//////////////////////////////////////

const TYPE_NAMES = {
    "empathy": "정서 공감형",
    "cognitive": "인지 성찰형",
    "motivation": "동기 촉진형",
    "execution": "행동 실천형",
    "relation": "관계 조율형",
    "resilience": "회복 유지형"
};

// 각 유형별 6턴 상담 스크립트
const SCRIPT = {

   //////////////////////////////
   // 1. 정서 공감형
   //////////////////////////////
   "empathy": [
        { q: "지금 가장 먼저 떠오르는 감정은 어떤가요?", 
          c: ["기쁨", "불안", "답답함", "피곤함", "설명하기 어려운 감정"] },

        { q: "그 감정을 가장 강하게 느낀 순간은 언제였나요?", 
          c: ["오늘 아침", "사람과 대화할 때", "혼자 있을 때", "일이 잘 안 풀릴 때", "특별한 사건은 없음"] },

        { q: "그 감정에 이름을 붙인다면 어떤 말이 가장 가깝나요?", 
          c: ["서운함", "긴장감", "허무함", "안정감", "복합적인 감정"] },

        { q: "그 감정을 느끼는 자신에게 어떤 말을 건네주고 싶나요?", 
          c: ["괜찮아, 잘하고 있어", "지금 힘들겠지만 지나갈 거야", "너무 신경 쓰지 말자", "잠시 쉬자", "말하기 어렵다"] },

        { q: "누군가가 지금 당신에게 어떤 방식으로 공감해주면 가장 좋을까요?", 
          c: ["조용히 들어주기", "따뜻한 말", "논리적 설명", "그냥 옆에 있기", "모르겠다"] },

        { q: "지금 대화를 나누며 감정이 조금은 변했나요?", 
          c: ["조금 나아짐", "비슷함", "더 복잡해짐", "잘 모르겠음"] }
   ],


   //////////////////////////////
   // 2. 인지 성찰형
   //////////////////////////////
   "cognitive": [
        { q: "지금 머릿속에서 가장 떠오르는 생각 한 가지가 있다면 무엇인가요?",
          c: ["해야 할 일", "걱정거리", "앞으로의 계획", "사람과의 관계", "정확히 모르겠음"] },

        { q: "그 생각과 관련해 가장 핵심 문제는 무엇이라고 느끼나요?",
          c: ["정보 부족", "시간 부족", "감정 문제", "타인과의 갈등", "정확히 모르겠음"] },

        { q: "지금의 생각/문제를 바라보는 당신의 사고 패턴은 어떤가요?",
          c: ["완벽주의", "미루기", "걱정이 많음", "분석적임", "모르겠음"] },

        { q: "이 문제를 바꾸기 위해 가장 먼저 조정하고 싶은 부분은 무엇인가요?",
          c: ["생각 방식", "감정 관리", "시간 관리", "대인 관계 방식", "아직 없음"] },

        { q: "그 변화를 위해 가장 작게 시작할 수 있는 행동은 무엇일까요?",
          c: ["일 분만 해보기", "메모로 정리하기", "사람에게 말하기", "쉬는 시간 확보", "모르겠다"] },

        { q: "지금 대화를 통해 머릿속이 조금 정리되었나요?",
          c: ["네, 정리됨", "조금 정리됨", "그대로임", "잘 모르겠음"] }
   ],


   //////////////////////////////
   // 3. 동기 촉진형
   //////////////////////////////
   "motivation": [
        { q: "요즘 에너지가 가장 떨어지는 지점은 무엇인가요?",
          c: ["일", "관계", "건강", "감정", "딱히 없음"] },

        { q: "반대로, 당신에게 에너지를 주는 요소는 무엇인가요?",
          c: ["성취감", "칭찬", "휴식", "새로운 경험", "가끔 다름"] },

        { q: "지금 떠오르는 '작은 목표'가 있다면 어떤가요?",
          c: ["정리하기", "산책하기", "연락하기", "쉬기", "없음"] },

        { q: "그 목표가 당신에게 의미 있는 이유는 무엇일까요?",
          c: ["성장", "관계", "건강", "의무감", "잘 모르겠음"] },

        { q: "오늘 하루를 더 나아지게 만드는 한 문장을 만든다면?",
          c: ["나는 할 수 있다", "조금씩 나아진다", "잘하고 있다", "오늘 만큼은 쉬자", "만들기 어렵다"] },

        { q: "지금의 동기 수준을 말한다면?",
          c: ["높아짐", "조금 올라감", "비슷함", "잘 모르겠음"] }
   ],


   //////////////////////////////
   // 4. 행동 실천형
   //////////////////////////////
   "execution": [
        { q: "최근에 미루고 있는 일이 있다면 무엇인가요?",
          c: ["정리", "연락", "업무", "건강관리", "특별히 없음"] },

        { q: "그 일을 '한 단계'로 쪼개면 어떤 행동이 되나요?",
          c: ["5분만 하기", "도구 준비하기", "메모하기", "사람에게 말하기", "쪼개기 어려움"] },

        { q: "실행을 방해하는 가장 큰 요인은 무엇인가요?",
          c: ["귀찮음", "피로", "시간 부족", "불안", "모름"] },

        { q: "그 방해요인을 줄이기 위해 할 수 있는 건 무엇인가요?",
          c: ["시간 정해두기", "쉬었다 하기", "사람에게 도움 요청", "환경 바꾸기", "잘 모르겠음"] },

        { q: "지금 가장 현실적인 '실행 선언'을 해본다면?",
          c: ["지금 바로 3분", "오늘 안에 5분", "내일 첫 일정으로", "주말에 정리", "아직 자신없음"] },

        { q: "지금 행동에 옮길 가능성은 어느 정도인가요?",
          c: ["높음", "중간", "낮음", "잘 모르겠음"] }
   ],


   //////////////////////////////
   // 5. 관계 조율형
   //////////////////////////////
   "relation": [
        { q: "요즘 가장 신경 쓰이는 관계는 어떤 관계인가요?",
          c: ["가족", "친구", "직장", "연인/배우자", "특별히 없음"] },

        { q: "현재 그 관계의 분위기는 어떤가요?",
          c: ["좋음", "어색함", "멀어짐", "갈등 중", "모르겠음"] },

        { q: "그 관계 속에서 당신이 맡고 있는 역할은 무엇인가요?",
          c: ["배려형", "리더형", "중재형", "거리를 두는 편", "모르겠음"] },

        { q: "그 관계에서 바꾸고 싶은 한 가지가 있다면 무엇인가요?",
          c: ["대화 방식", "거리를 조절", "감정 표현", "갈등 해결", "아직 없음"] },

        { q: "다음 대화에서 시도해보고 싶은 작은 행동은?",
          c: ["먼저 인사하기", "감정 말하기", "상대 말 듣기", "시간 요청", "모르겠음"] },

        { q: "지금 이 관계에 대한 감정은 어떤가요?",
          c: ["나아짐", "조금 편안", "비슷함", "잘 모르겠음"] }
   ],


   //////////////////////////////
   // 6. 회복 유지형
   //////////////////////////////
   "resilience": [
        { q: "최근 가장 스트레스를 준 사건은 무엇인가요?",
          c: ["일", "사람", "건강", "환경 변화", "크게 없음"] },

        { q: "그 상황에서 나타난 당신의 반응은 어떤가요?",
          c: ["걱정", "피로", "짜증", "무기력", "잘 모르겠음"] },

        { q: "예전에 잘 먹혔던 '회복 전략'이 있다면?",
          c: ["산책", "휴식", "대화", "취미", "떠오르지 않음"] },

        { q: "반대로, 지금은 효과가 적은 전략은?",
          c: ["참기", "걱정하기", "과도한 일", "피할 수 없음", "모름"] },

        { q: "오늘 시도해볼 수 있는 새로운 회복 행동은?",
          c: ["천천히 걷기", "잠시 휴식", "정리하기", "따뜻한 물 마시기", "모르겠다"] },

        { q: "지금의 안정감 수준은 어떤가요?",
          c: ["높음", "조금 안정", "비슷함", "잘 모르겠음"] }
   ]
};


//////////////////////////////////////
// 2) 대화 엔진
//////////////////////////////////////

let userType = null;
let turnIndex = 0;
let history = [];

// UI 업데이트
function renderChat() {
    const chatBox = document.getElementById("chat");
    chatBox.innerHTML = "";

    history.forEach(h => {
        if (h.from === "bot") {
            chatBox.innerHTML += `<div class="bubble-bot"><span>${h.text}</span></div>`;
        } else {
            chatBox.innerHTML += `<div class="bubble-user"><span>${h.text}</span></div>`;
        }
    });
}

// 선택지 출력
function renderChoices() {
    const panel = document.getElementById("choices");
    panel.innerHTML = "";

    if (!userType) return;

    const step = SCRIPT[userType][turnIndex];
    if (!step) return;

    step.c.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.innerText = choice;
        btn.onclick = function() {
            userSelect(choice);
        };
        panel.appendChild(btn);
    });
}

// 사용자 선택 처리
function userSelect(choice) {
    history.push({from:"user", text: choice});
    turnIndex++;

    if (turnIndex >= 6) {
        endConversation();
        return;
    }

    const nextQ = SCRIPT[userType][turnIndex].q;
    history.push({from:"bot", text: nextQ});
    renderChat();
    renderChoices();
}

// 시작 (유형 선택)
function startType() {
    const type = document.getElementById("typeSelect").value;
    if (!type) return alert("유형을 선택해주세요!");

    userType = type;
    turnIndex = 0;
    history = [];

    // 첫 질문 시작
    const firstQ = SCRIPT[userType][0].q;
    history.push({from:"bot", text: firstQ});

    renderChat();
    renderChoices();

    document.getElementById("type-area").style.display = "none";
    document.getElementById("chat-area").style.display = "block";
}

// 대화 종료
function endConversation() {
    history.push({from:"bot", text:"오늘 대화를 마무리해볼게요. 지금까지의 이야기를 잘 들었어요."});
    renderChat();
    document.getElementById("choices").innerHTML = "";
}

</script>

</head>

<body>
<div class="container">

<h1>LT — Emotional Talk (HF 기반 6유형 맞춤형 상담)</h1>
<div class="sub">유형별 맞춤 대화를 객관식 선택으로 6턴 진행합니다.</div>

<!-- 유형 선택 -->
<div id="type-area">
    <div class="select-box">
        <b>어떤 성향(HF 유형)으로 상담을 진행할까요?</b><br><br>
        <select id="typeSelect" style="padding:10px; font-size:16px; width:100%;">
            <option value="">선택하세요</option>
            <option value="empathy">정서 공감형</option>
            <option value="cognitive">인지 성찰형</option>
            <option value="motivation">동기 촉진형</option>
            <option value="execution">행동 실천형</option>
            <option value="relation">관계 조율형</option>
            <option value="resilience">회복 유지형</option>
        </select>
        <button onclick="startType()">상담 시작하기</button>
    </div>
</div>

<!-- 대화 UI -->
<div id="chat-area" style="display:none;">
    <div id="chat" style="margin-bottom:20px;"></div>
    <div id="choices"></div>
</div>

</div>
</body>
</html>
