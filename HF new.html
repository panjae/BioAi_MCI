<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCI DTx – HF(4×4) 공식문항 기반 설문</title>
<style>
  :root{--bg:#0b1220;--card:#121a2a;--fg:#eaf2ff;--muted:#9fb3d1;--accent:#7aa2ff;--accent2:#37d6b5;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif;font-size:18px}
  body.large{font-size:20px}
  .wrap{max-width:1000px;margin:24px auto;padding:16px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
  header{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{margin:0;font-size:24px}
  .muted{color:var(--muted)}
  .controls{display:flex;gap:8px}
  .controls button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:#223050;color:#b9c7e6}
  .progress{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
  .bar{height:14px;background:#24304a;border-radius:8px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--accent),#b388ff);width:0%;transition:width .35s ease}
  .meta{display:flex;gap:18px;margin-top:12px;font-size:16px;color:var(--muted)}
  .stage{padding:22px 24px}
  .qid{display:inline-block;padding:8px 14px;border-radius:999px;background:#1b253a;color:#9fb3d1;font-weight:700;font-size:15px;margin-bottom:16px}
  .qtext{font-size:26px;line-height:1.6;font-weight:800;margin:8px 0 20px}
  .help{font-size:16px;color:#cbd8ef;margin:0 0 14px}
  .opts{display:flex;flex-wrap:wrap;gap:12px}
  .opt{background:#1a2439;border:3px solid #2a3858;border-radius:14px;padding:14px 16px;cursor:pointer;font-weight:800;min-width:180px;text-align:center}
  .opt.selected{border-color:var(--accent);background:#1f2e4e;box-shadow:0 0 0 3px rgba(122,162,255,.18) inset}
  .nav{display:flex;justify-content:space-between;gap:12px;padding:20px 24px;border-top:1px solid rgba(255,255,255,.06)}
  button.big{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer;font-size:18px}
  .ghost{background:#223050;color:#b9c7e6}
  .primary{background:linear-gradient(90deg,var(--accent),#b388ff);color:#0c1235}
  .primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}
  .hidden{display:none}
  .result{padding:22px 24px}
  .grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:960px){.grid{grid-template-columns:1fr 1fr}}
  .panel{background:#0f1626;border:1px solid #27324e;border-radius:14px;padding:16px}
  .panel h3{margin:0 0 10px;font-size:20px}
  .bigline{font-size:20px;margin-bottom:6px}
  .tag{display:inline-block;margin-left:10px;padding:5px 10px;border-radius:999px;background:#1b253a;color:#9fb3d1;font-size:13px}
  canvas{width:100%;height:340px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app" role="application">
    <header>
      <h1>🧠 HF(4×4) 공식문항 기반 설문</h1>
      <div class="controls">
        <button id="fontUp" aria-label="글자 크게">A+</button>
        <button id="fontDown" aria-label="글자 작게">A−</button>
      </div>
      <div class="muted" id="phaseLabel">준비</div>
    </header>

    <div class="progress" aria-live="polite">
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div class="meta">
        <div>단계: <span id="stageName">Intro</span></div>
        <div>진행: <span id="count">0</span>/<span id="total">0</span></div>
      </div>
    </div>

    <!-- 안내 -->
    <div class="stage" id="stageIntro">
      <div class="qid">안내</div>
      <p class="qtext">질문을 <b>한 개씩</b> 보여드립니다. 맞는 것을 <b>눌러</b> 주세요.<br>응답은 <b>전혀 아니다 ~ 매우 그렇다(5점)</b> 중 하나를 고릅니다.</p>
      <p class="help">대화방식(4유형) 24문항 → 대화주제(4유형) 24문항, 총 48문항</p>
      <div class="nav">
        <button class="big ghost" disabled>← 이전</button>
        <button class="big primary" id="startBtn">🟢 시작하기</button>
      </div>
    </div>

    <!-- 질문 -->
    <div class="stage hidden" id="stageQ">
      <div class="qid" id="qid">문항</div>
      <div class="qtext" id="qtext">질문 텍스트</div>
      <p class="help" id="hint">맞는 답 하나를 눌러 주세요.</p>
      <div class="opts" id="opts" role="group" aria-label="응답 선택"></div>
      <div class="nav">
        <button class="big ghost" id="prevBtn">← 이전</button>
        <button class="big primary" id="nextBtn" disabled>다음 →</button>
      </div>
    </div>

    <!-- 결과 -->
    <div class="result hidden" id="stageResult">
      <div class="grid">
        <div class="panel">
          <h3>🗣️ 대화방식 결과</h3>
          <div class="bigline" id="styleSummary">-</div>
          <div class="muted" id="styleSub">-</div>
        </div>
        <div class="panel">
          <h3>💭 대화주제 결과</h3>
          <div class="bigline" id="topicSummary">-</div>
          <div class="muted" id="topicSub">-</div>
        </div>
        <div class="panel">
          <h3>📈 레이더 차트 – 대화방식</h3>
          <canvas id="styleChart"></canvas>
        </div>
        <div class="panel">
          <h3>📈 레이더 차트 – 대화주제</h3>
          <canvas id="topicChart"></canvas>
        </div>
      </div>
      <div class="nav">
        <button class="big ghost" id="restartBtn">🔁 처음으로</button>
        <span></span>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================
   손쉬운 보기: 글자 크기
========================= */
(function(){
  const body=document.body;
  document.getElementById('fontUp').onclick=()=>body.classList.add('large');
  document.getElementById('fontDown').onclick=()=>body.classList.remove('large');
})();

/* =========================
   응답 라벨
========================= */
const ANSWERS = ["전혀 아니다","대체로 아니다","보통이다","대체로 그렇다","매우 그렇다"];
const answerToScore = label => ANSWERS.indexOf(label)+1; // 1~5

/* =========================
   1) 대화방식 4유형 (공식 검사지 참조)
   - 공감형: IRI 기반
   - 인지형: CERQ 기반
   - 동기형: SRQ/MITI 기반
   - 행동형: BADS 기반
========================= */
const STYLE_TYPES = ["공감형","인지형","동기형","행동형"];
const STYLE_QUESTIONS = [
  // 공감형(IRI)
  ["다른 사람의 입장에서 생각하려고 노력합니다.","공감형"],
  ["누군가 속상해 보이면 저도 마음이 아픕니다.","공감형"],
  ["이야기를 들을 때, 상대의 감정을 먼저 살핍니다.","공감형"],
  ["누가 어려움을 겪으면 도와주고 싶습니다.","공감형"],
  ["사람들의 감정을 잘 알아차리는 편입니다.","공감형"],
  ["말을 할 때 상대가 상처받지 않도록 조심합니다.","공감형"],
  // 인지형(CERQ)
  ["힘든 일이 생기면 그 이유를 논리적으로 생각합니다.","인지형"],
  ["문제를 객관적으로 분석하려고 합니다.","인지형"],
  ["감정보다 생각으로 판단하는 편입니다.","인지형"],
  ["같은 일을 다른 각도에서 생각해 보려 합니다.","인지형"],
  ["문제를 단계적으로 해결하려고 합니다.","인지형"],
  ["일어난 일을 머릿속으로 정리하면 마음이 안정됩니다.","인지형"],
  // 동기형(SRQ/MITI)
  ["내가 목표를 세우면 스스로 동기를 유지하려 노력합니다.","동기형"],
  ["다른 사람의 칭찬보다 스스로의 의지가 더 중요하다고 생각합니다.","동기형"],
  ["어려워도 ‘왜 이걸 하는지’를 떠올리면 포기하지 않습니다.","동기형"],
  ["변화는 내 선택으로부터 온다고 믿습니다.","동기형"],
  ["누가 ‘잘할 수 있다’고 격려하면 의욕이 생깁니다.","동기형"],
  ["힘든 일도 의미가 있으면 꾸준히 합니다.","동기형"],
  // 행동형(BADS)
  ["작은 일이라도 직접 실천하면 기분이 나아집니다.","행동형"],
  ["해야 할 일을 미루기보다 바로 하는 편입니다.","행동형"],
  ["하루 일과를 미리 정해두면 편안합니다.","행동형"],
  ["구체적인 목표를 세워두면 실천이 쉬워집니다.","행동형"],
  ["계획대로 하지 못하면 불편합니다.","행동형"],
  ["행동으로 옮길 때 자신감이 생깁니다.","행동형"]
];

/* =========================
   2) 대화주제 4유형 (공식 검사지 참조)
   - 자기인식·정서조절: DERS/CERQ
   - 관계·소통: ICQ
   - 회복·적응: CD-RISC
   - 행동·습관: BADS
========================= */
const TOPIC_TYPES = ["자기인식·정서조절","관계·소통","회복·적응","행동·습관"];
const TOPIC_QUESTIONS = [
  // 자기인식·정서조절(DERS/CERQ)
  ["화가 날 때 내 감정을 알아차릴 수 있습니다.","자기인식·정서조절"],
  ["기분이 나쁠 때, 왜 그런지 곰곰이 생각합니다.","자기인식·정서조절"],
  ["마음이 불안할 때 숨을 고르며 진정하려고 합니다.","자기인식·정서조절"],
  ["감정을 말로 표현하는 게 어렵지 않습니다.","자기인식·정서조절"],
  ["속상한 기분이 들어도 너무 오래 끌지 않습니다.","자기인식·정서조절"],
  ["감정이 너무 강할 땐 잠시 멈추고 진정합니다.","자기인식·정서조절"],
  // 관계·소통(ICQ)
  ["상대가 말할 때 끝까지 듣는 편입니다.","관계·소통"],
  ["부드럽게 거절하는 말을 할 수 있습니다.","관계·소통"],
  ["갈등이 생기면 먼저 풀어보려 합니다.","관계·소통"],
  ["관계에서 내 생각을 솔직히 표현할 수 있습니다.","관계·소통"],
  ["다른 사람의 입장을 이해하려 노력합니다.","관계·소통"],
  ["불편한 관계도 대화를 통해 개선하려 합니다.","관계·소통"],
  // 회복·적응(CD-RISC)
  ["힘든 일을 겪어도 다시 일어설 수 있습니다.","회복·적응"],
  ["어려운 일을 겪을 때 배우는 점이 있습니다.","회복·적응"],
  ["문제가 생기면 긍정적으로 해결책을 찾습니다.","회복·적응"],
  ["나쁜 일도 결국 지나간다고 생각합니다.","회복·적응"],
  ["위기 상황에서도 침착하려고 합니다.","회복·적응"],
  ["실패를 통해 더 강해질 수 있다고 믿습니다.","회복·적응"],
  // 행동·습관(BADS)
  ["규칙적인 생활을 하려고 노력합니다.","행동·습관"],
  ["매일 같은 시간에 자고 일어납니다.","행동·습관"],
  ["집안일이나 산책 같은 활동을 꾸준히 합니다.","행동·습관"],
  ["활동을 하면 기분이 좋아집니다.","행동·습관"],
  ["하루 목표를 세우면 도움이 됩니다.","행동·습관"],
  ["스스로 생활을 관리할 수 있습니다.","행동·습관"]
];

/* =========================
   상태 & 유틸
========================= */
let phase="intro"; // intro -> style -> topic -> result
let orderStyle=[], orderTopic=[], idx=0;
let answersStyle={}, answersTopic={};

const $ = id => document.getElementById(id);

function shuffle(n){
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function setPhase(p){
  phase=p;
  $("phaseLabel").textContent=(p==="style"?"대화방식":p==="topic"?"대화주제":p==="result"?"결과":"준비");
  $("stageName").textContent=(p==="style"?"Style":p==="topic"?"Topic":p==="result"?"Result":"Intro");
  $("stageIntro").classList.toggle("hidden",p!=="intro");
  $("stageQ").classList.toggle("hidden",!(p==="style"||p==="topic"));
  $("stageResult").classList.toggle("hidden",p!=="result");
  const total=(p==="style")?orderStyle.length:(p==="topic")?orderTopic.length:0;
  $("total").textContent=total; updateProgress();
}
function updateProgress(){
  const total=(phase==="style")?orderStyle.length:(phase==="topic")?orderTopic.length:1;
  const cur=(phase==="style"||phase==="topic")?idx+1:total;
  $("count").textContent=(phase==="style"||phase==="topic")?cur:0;
  const pct=(phase==="style"||phase==="topic")?Math.round(cur/total*100):(phase==="result"?100:0);
  $("fill").style.width=pct+"%";
}

/* =========================
   질문 렌더링
========================= */
function renderQuestion(){
  const list=(phase==="style")?STYLE_QUESTIONS:TOPIC_QUESTIONS;
  const order=(phase==="style")?orderStyle:orderTopic;
  const [text]=list[order[idx]];
  $("qid").textContent=`${phase==="style"?"대화방식":"대화주제"} ${idx+1}/${order.length}`;
  $("qtext").textContent=text;

  const stored=(phase==="style"?answersStyle:answersTopic)[order[idx]];
  $("opts").innerHTML = ANSWERS.map(a=>`
    <div class="opt ${stored===a?"selected":""}" data-val="${a}" role="button" tabindex="0" aria-pressed="${stored===a?'true':'false'}">
      ${a}
    </div>`).join("");

  [...document.querySelectorAll("#opts .opt")].forEach(el=>{
    const select=()=>{
      [...document.querySelectorAll("#opts .opt")].forEach(x=>{x.classList.remove("selected"); x.setAttribute("aria-pressed","false");});
      el.classList.add("selected"); el.setAttribute("aria-pressed","true");
      if(phase==="style") answersStyle[order[idx]] = el.dataset.val;
      else answersTopic[order[idx]] = el.dataset.val;
      $("nextBtn").disabled=false;
    };
    el.onclick=select;
    el.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(); } };
  });

  $("prevBtn").disabled = idx===0;
  $("nextBtn").textContent = (idx===order.length-1) ? (phase==="style"?"다음 단계 →":"결과 보기") : "다음 →";
  $("nextBtn").disabled = !stored;
  updateProgress();
}

/* =========================
   점수/결과
========================= */
function computeScores(ansMap,list,types){
  const sums={}; types.forEach(t=>sums[t]=0);
  Object.entries(ansMap).forEach(([i,label])=>{
    const s = answerToScore(label);
    const cat = list[i][1];
    sums[cat] += s;
  });
  return sums;
}
function top2(scores){
  const arr = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  return [arr[0]||[null,0], arr[1]||[null,0]];
}
function explainStyle(k){
  const m={
    "공감형":"따뜻한 경청과 공감을 선호합니다.",
    "인지형":"이유를 파악하고 차근차근 정리하는 대화를 선호합니다.",
    "동기형":"격려와 의미 찾기를 통해 의욕을 높이는 대화를 선호합니다.",
    "행동형":"구체적인 계획과 점검이 있는 실천 중심 대화를 선호합니다."
  }; return m[k]||"-";
}
function explainTopic(k){
  const m={
    "자기인식·정서조절":"감정을 알아차리고 조절하는 주제를 선호합니다.",
    "관계·소통":"가족·친구와의 대화와 소통을 다루는 주제를 선호합니다.",
    "회복·적응":"어려움을 이겨내는 방법과 태도를 다루는 주제를 선호합니다.",
    "행동·습관":"생활 루틴과 작은 목표를 실천하는 주제를 선호합니다."
  }; return m[k]||"-";
}

/* =========================
   레이더 차트(Canvas)
========================= */
function drawRadar(canvas, labels, values, color, max){
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.clientWidth;
  const H=canvas.height=canvas.clientHeight;
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, r=Math.min(W,H)*0.38;
  const N=labels.length;

  // 격자
  ctx.strokeStyle="#2b395a"; ctx.lineWidth=1.5;
  for(let ring=1; ring<=5; ring++){
    const rr=r*ring/5; ctx.beginPath();
    for(let i=0;i<N;i++){
      const ang=-Math.PI/2 + i*2*Math.PI/N;
      const x=cx+rr*Math.cos(ang), y=cy+rr*Math.sin(ang);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }
  // 축 + 라벨
  for(let i=0;i<N;i++){
    const ang=-Math.PI/2 + i*2*Math.PI/N;
    const x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const lx=cx+(r+22)*Math.cos(ang), ly=cy+(r+22)*Math.sin(ang);
    ctx.fillStyle="#d8e4ff"; ctx.font="16px system-ui";
    ctx.textAlign = Math.cos(ang)>0.3 ? "left" : (Math.cos(ang)<-0.3 ? "right" : "center");
    ctx.textBaseline = Math.sin(ang)>0.3 ? "top" : (Math.sin(ang)<-0.3 ? "bottom" : "middle");
    ctx.fillText(labels[i], lx, ly);
  }
  // 다각형
  const rgba=(hex,a)=>{const m=hex.match(/^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$/i);if(!m)return hex;
    const r=parseInt(m[1],16),g=parseInt(m[2],16),b=parseInt(m[3],16);return `rgba(${r},${g},${b},${a})`;};
  const pts=[];
  for(let i=0;i<N;i++){
    const v=values[i]||0;
    const rr=r*(v/max);
    const ang=-Math.PI/2 + i*2*Math.PI/N;
    pts.push([cx+rr*Math.cos(ang), cy+rr*Math.sin(ang)]);
  }
  ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.closePath(); ctx.fillStyle=rgba(color,0.25); ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle=color; pts.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();});
}

/* =========================
   이벤트
========================= */
function renderAndUpdate(){
  const total=(phase==="style")?orderStyle.length:orderTopic.length;
  $("total").textContent=total;
  renderQuestion();
}
document.getElementById("startBtn").onclick=()=>{
  orderStyle = shuffle(STYLE_QUESTIONS.length);
  orderTopic = shuffle(TOPIC_QUESTIONS.length);
  answersStyle = {}; answersTopic = {}; idx=0;
  setPhase("style"); renderAndUpdate();
};
document.getElementById("prevBtn").onclick=()=>{ if(idx>0){idx--; renderQuestion();} };
document.getElementById("nextBtn").onclick=()=>{
  const order=(phase==="style")?orderStyle:orderTopic;
  if(idx < order.length-1){
    idx++; renderQuestion();
  }else{
    if(phase==="style"){ idx=0; setPhase("topic"); renderAndUpdate(); }
    else{
      const ss = computeScores(answersStyle, STYLE_QUESTIONS, STYLE_TYPES);
      const ts = computeScores(answersTopic, TOPIC_QUESTIONS, TOPIC_TYPES);
      const [s1,s2] = top2(ss), [t1,t2] = top2(ts);

      document.getElementById("styleSummary").innerHTML = s1[0] ? `주 성향: <b>${s1[0]}</b><span class="tag">보조: ${s2[0]||"-"}</span>` : "-";
      document.getElementById("topicSummary").innerHTML = t1[0] ? `주 성향: <b>${t1[0]}</b><span class="tag">보조: ${t2[0]||"-"}</span>` : "-";
      document.getElementById("styleSub").textContent = explainStyle(s1[0]);
      document.getElementById("topicSub").textContent = explainTopic(t1[0]);

      setPhase("result");
      // 각 유형 6문항 × 5점 = 최대 30
      const sVals = STYLE_TYPES.map(k=>ss[k]||0);
      const tVals = TOPIC_TYPES.map(k=>ts[k]||0);
      drawRadar(document.getElementById("styleChart"), STYLE_TYPES, sVals, "#7aa2ff", 30);
      drawRadar(document.getElementById("topicChart"), TOPIC_TYPES, tVals, "#37d6b5", 30);
    }
  }
};
document.getElementById("restartBtn").onclick=()=>{ setPhase("intro"); document.getElementById("fill").style.width="0%"; };
setPhase("intro");
</script>
