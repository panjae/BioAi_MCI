<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HF(6) 설문 – 대화유형/주제 6축 진단</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>
  :root{
    --bg:#f6f8ff; --card:#fff; --line:#e6ebf3; --fg:#0f1a3a; --acc:#3a72ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui}
  .wrap{max-width:960px;margin:24px auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px rgba(15,26,58,.06);overflow:hidden}
  header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  h1{margin:0;font-size:20px;font-weight:800}
  .progress{height:10px;background:#e9eefc;border-radius:8px;overflow:hidden;margin:12px 18px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#98b0ff);transition:width .2s}
  .step{padding:18px}
  .qhead{font-size:18px;font-weight:800;margin:6px 0 12px}
  .qtext{font-size:20px;line-height:1.6;margin:10px 0 16px}
  .opts{display:flex;flex-wrap:wrap;gap:12px}
  .opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#f5f7ff;cursor:pointer}
  .opt input{transform:scale(1.2)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
  button{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#f1f4ff;color:#0f1a3a;font-weight:800;cursor:pointer}
  button.primary{background:linear-gradient(90deg,var(--acc),#7ea0ff);border:0}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:900px){ .grid{grid-template-columns:1fr 1fr} }
  .panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#f8faff;font-size:12px;margin-left:8px}
  .lead{margin:0 0 8px;font-weight:800}
  .desc{margin:6px 0 0;color:#3b4a6a}
  .footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app">
    <header>
      <h1>🧠 HF(6) 설문 – 대화유형·주제 6축 성향 진단</h1>
      <div class="pill">총 30문항</div>
    </header>

    <div class="progress"><div id="bar" class="bar"></div></div>

    <!-- 질문 단계 -->
    <div id="step-quiz" class="step">
      <div class="qhead" id="qhead">문항 <span id="qIdx">1</span> / <span id="qTotal">30</span></div>
      <div class="qtext" id="qtext">질문이 여기에 표시됩니다.</div>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button id="prevBtn">← 이전</button>
        <button id="nextBtn" class="primary">다음 →</button>
      </div>
    </div>

    <!-- 결과 단계 -->
    <div id="step-result" class="step" style="display:none">
      <div class="grid">
        <div class="panel">
          <p class="lead">🗣️ 대화 성향 결과</p>
          <div>주 성향: <b id="mainType">-</b> <span class="pill">보조: <span id="subType">-</span></span></div>
          <p class="desc" id="typeDesc">결과 설명이 여기에 표시됩니다.</p>
        </div>
        <div class="panel">
          <p class="lead">📊 총점 요약</p>
          <div id="sumText"></div>
        </div>
      </div>

      <div class="panel" style="margin-top:12px">
        <p class="lead">📈 성향 분포(육각형)</p>
        <canvas id="radar" height="340"></canvas>
      </div>

      <div class="footer">
        <div class="pill">이 결과는 학습·상담 시뮬레이션용이며 임상진단 도구가 아닙니다.</div>
        <button id="resetBtn">처음으로</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================
   1) 유형 정의 & 설명
========================= */
const TYPES = [
  { key:'EE', name:'정서 공감형',  desc:'상대 감정 변화를 빠르게 파악하고, 말투·속도를 조절하며 공감적으로 반응합니다.' },
  { key:'CR', name:'인지 성찰형',  desc:'문제의 원인과 논리를 우선 파악하고, 정보를 구조화해 차분히 대화합니다.' },
  { key:'MA', name:'동기 촉진형',  desc:'의미·목표가 분명할 때 에너지가 오르며, 상대의 장점을 발견해 동기를 북돋습니다.' },
  { key:'BE', name:'행동 실천형',  desc:'계획을 세우면 곧바로 실행하고, 작은 목표로 행동을 이어가는 실천력이 강합니다.' },
  { key:'RR', name:'관계 조율형',  desc:'분위기를 조절해 상대가 편안하도록 돕고, 갈등 시 상호 이익이 있는 해결을 지향합니다.' },
  { key:'RM', name:'회복 유지형',  desc:'감정이 흔들려도 자신만의 회복 기술로 균형을 되찾고, 변화에 안정적으로 적응합니다.' },
];
const TYPE_INDEX = TYPES.reduce((acc,t,i)=>{acc[t.key]=i;return acc;},{});

/* =========================
   2) 문항(6유형 × 5문항)
     - rev: true 면 역채점(※)
========================= */
const QUESTIONS_RAW = [
  // 정서 공감형 EE
  {t:'EE', txt:'나는 상대의 기분 변화를 빠르게 알아차리는 편이다.', rev:false},
  {t:'EE', txt:'누군가 속상한 모습을 보이면 자연스럽게 마음이 쓰인다.', rev:false},
  {t:'EE', txt:'대화할 때 상대의 감정을 고려해 말투를 조절한다.', rev:false},
  {t:'EE', txt:'새로운 사람을 만나도 상대의 감정을 이해하려 노력한다.', rev:false},
  {t:'EE', txt:'다른 사람의 감정을 신경 쓰지 않는 편이다.', rev:true}, // ※

  // 인지 성찰형 CR
  {t:'CR', txt:'문제 상황이 생기면 감정보다 먼저 원인을 분석한다.', rev:false},
  {t:'CR', txt:'대화에서 상대의 말 전체 흐름과 논리를 먼저 파악한다.', rev:false},
  {t:'CR', txt:'새로운 정보나 관점을 접하면 생각을 깊이 정리한다.', rev:false},
  {t:'CR', txt:'감정보다 직관에 의존해 판단하는 편이다.', rev:true}, // ※
  {t:'CR', txt:'논리적 사고를 통해 문제를 단계적으로 해결하려고 한다.', rev:false},

  // 동기 촉진형 MA
  {t:'MA', txt:'일이 의미가 있으면 쉽게 동기가 생긴다.', rev:false},
  {t:'MA', txt:'목표가 명확하면 스스로 에너지가 생긴다.', rev:false},
  {t:'MA', txt:'새로운 도전이나 경험을 찾으면 동기가 상승한다.', rev:false},
  {t:'MA', txt:'다른 사람의 성취나 장점을 발견하면 힘을 실어주는 편이다.', rev:false},
  {t:'MA', txt:'목표나 의미가 불분명하면 쉽게 포기하는 편이다.', rev:true}, // ※

  // 행동 실천형 BE
  {t:'BE', txt:'해야 할 일이 생기면 가능한 빨리 행동으로 옮긴다.', rev:false},
  {t:'BE', txt:'계획을 세우면 웬만하면 그대로 지키려 한다.', rev:false},
  {t:'BE', txt:'새로운 아이디어를 실행 단계로 옮기는 것을 즐긴다.', rev:false},
  {t:'BE', txt:'일을 미루는 편이라 계획대로 실행하기 어렵다.', rev:true}, // ※
  {t:'BE', txt:'하루 목표를 정해두면 효율적으로 실천할 수 있다.', rev:false},

  // 관계 조율형 RR
  {t:'RR', txt:'대화할 때 상대가 불편하지 않도록 분위기를 조절한다.', rev:false},
  {t:'RR', txt:'갈등이 생기면 서로에게 손해가 적은 해결책을 찾으려 한다.', rev:false},
  {t:'RR', txt:'새로운 사람과 관계를 맺을 때 적극적으로 친밀감을 쌓으려 한다.', rev:false},
  {t:'RR', txt:'상대가 편안한지 늘 주의 깊게 살핀다.', rev:false},
  {t:'RR', txt:'관계의 조화보다 내 의견 전달이 우선이라고 생각한다.', rev:true}, // ※

  // 회복 유지형 RM
  {t:'RM', txt:'감정이 흔들려도 나만의 회복 방법을 사용한다.', rev:false},
  {t:'RM', txt:'어려움을 겪어도 다시 균형을 회복하려 노력한다.', rev:false},
  {t:'RM', txt:'새로운 환경이나 변화가 와도 차분하게 적응하려 한다.', rev:false},
  {t:'RM', txt:'부정적인 상황에서는 쉽게 불안해진다.', rev:true}, // ※
  {t:'RM', txt:'스트레스를 받아도 일정 시간이 지나면 감정이 안정된다.', rev:false},
];

/* =========================
   3) 상태
========================= */
const totalQ = QUESTIONS_RAW.length; // 30
let order = shuffle([...Array(totalQ).keys()]);
let answers = Array(totalQ).fill(null); // 0..4 저장
let idx = 0;                            // 현재 문항 인덱스(0~29)
let chart = null;

/* =========================
   4) UI 요소
========================= */
const qIdxEl = document.getElementById('qIdx');
const qTotalEl = document.getElementById('qTotal');
const qTextEl = document.getElementById('qtext');
const optsEl = document.getElementById('opts');
const barEl = document.getElementById('bar');

const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const stepQuiz = document.getElementById('step-quiz');
const stepResult = document.getElementById('step-result');

const mainTypeEl = document.getElementById('mainType');
const subTypeEl  = document.getElementById('subType');
const typeDescEl = document.getElementById('typeDesc');
const sumTextEl  = document.getElementById('sumText');
const radarCanvas= document.getElementById('radar');
const resetBtn   = document.getElementById('resetBtn');

qTotalEl.textContent = totalQ;

/* =========================
   5) 함수들
========================= */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function renderQuestion(){
  const real = order[idx];
  const item = QUESTIONS_RAW[real];
  qIdxEl.textContent = idx+1;
  qTextEl.textContent = item.txt;

  const choices = ['전혀 아니다','대체로 아니다','보통이다','대체로 그렇다','매우 그렇다'];
  optsEl.innerHTML = '';
  choices.forEach((label,k)=>{
    const id = `q${idx}_c${k}`;
    const wrap = document.createElement('label');
    wrap.className = 'opt';
    wrap.innerHTML = `<input type="radio" name="q${idx}" id="${id}" value="${k}"><span>${label}</span>`;
    optsEl.appendChild(wrap);
  });
  // 이전 응답 표시
  if(answers[real] !== null){
    const sel = optsEl.querySelector(`input[value="${answers[real]}"]`);
    if(sel) sel.checked = true;
  }
  // 진행바
  const answered = answers.filter(v=>v!==null).length;
  const prog = Math.round((answered/totalQ)*100);
  barEl.style.width = `${prog}%`;
  // 버튼 상태
  prevBtn.disabled = (idx===0);
  nextBtn.textContent = (idx===totalQ-1) ? '결과 보기 →' : '다음 →';
}

// 현재 문항의 선택값을 저장
function commitCurrent(){
  const real = order[idx];
  const checked = optsEl.querySelector('input[type="radio"]:checked');
  if(!checked) return false;
  answers[real] = parseInt(checked.value,10);
  return true;
}

// 점수 계산
function computeScores(){
  // 유형별 원점수(0~20): 5문항 × (0~4)
  const raw = [0,0,0,0,0,0]; // EE,CR,MA,BE,RR,RM
  const cnt = [0,0,0,0,0,0];
  QUESTIONS_RAW.forEach((q, realIndex)=>{
    let v = answers[realIndex];               // 0..4
    if(v===null) v = 0;
    if(q.rev) v = 4 - v;                      // 역채점
    const ti = TYPE_INDEX[q.t];
    raw[ti] += v;
    cnt[ti] += 1;
  });
  // 0~30 스케일 변환: (원점수/20)*30
  const scaled = raw.map(sum => Math.round((sum/20)*30));
  return {raw, scaled};
}

// 결과 표시
function showResult(){
  const {scaled} = computeScores();
  const pairs = TYPES.map((t,i)=>({name:t.name, key:t.key, v:scaled[i], desc:t.desc}))
                    .sort((a,b)=>b.v-a.v);
  const main = pairs[0], sub = pairs[1];

  mainTypeEl.textContent = `${main.name}`;
  subTypeEl.textContent  = `${sub.name}`;
  typeDescEl.textContent = TYPE_DESC(main.key);

  sumTextEl.innerHTML = pairs.map(p=>`• ${p.name}: <b>${p.v}</b>/30`).join('<br>');

  // Radar
  const labels = TYPES.map(t=>t.name);
  const data = scaled; // [..6]
  if(chart){ chart.destroy(); }
  chart = new Chart(radarCanvas, {
    type:'radar',
    data:{
      labels,
      datasets:[{
        label:'성향 점수',
        data,
        fill:true,
        borderWidth:2,
        pointRadius:3
      }]
    },
    options:{
      plugins:{ legend:{display:false} },
      scales:{ r:{ suggestedMin:0, suggestedMax:30, ticks:{stepSize:5,font:{size:11}}, pointLabels:{font:{size:12}} } }
    }
  });

  stepQuiz.style.display='none';
  stepResult.style.display='block';
}

function TYPE_DESC(key){
  switch(key){
    case 'EE': return '따뜻한 공감과 정서적 지지가 강점입니다. 초기 라포 형성, 감정 라벨링에 유리합니다.';
    case 'CR': return '상황 구조화, 논리적 재해석이 강점입니다. 문제 정리와 단계별 계획 수립에 유리합니다.';
    case 'MA': return '의미·목표 제시에 민감하게 반응합니다. 칭찬·강점 피드백과 작은 도전 과제가 효과적입니다.';
    case 'BE': return '작은 행동부터 시작해 확장하는 전략이 잘 맞습니다. 체크리스트/루틴화가 도움이 됩니다.';
    case 'RR': return '관계의 안전감·조화 유지가 중요합니다. 대화 규칙 합의, 역할 명확화가 효과적입니다.';
    case 'RM': return '회복 전략과 정서 안정 유지가 강점입니다. 호흡·수면·리듬을 지키는 계획이 유리합니다.';
    default: return '';
  }
}

/* =========================
   6) 이벤트
========================= */
prevBtn.onclick = ()=>{
  if(idx>0){ idx--; renderQuestion(); }
};
nextBtn.onclick = ()=>{
  if(!commitCurrent()){
    alert('하나를 선택해 주세요.');
    return;
  }
  if(idx<totalQ-1){
    idx++;
    renderQuestion();
  }else{
    showResult();
  }
};

resetBtn.onclick = ()=>{
  order = shuffle([...Array(totalQ).keys()]);
  answers = Array(totalQ).fill(null);
  idx = 0; chart && chart.destroy();
  stepResult.style.display='none';
  stepQuiz.style.display='block';
  renderQuestion();
};

/* =========================
   7) 시작
========================= */
renderQuestion();
</script>
</body>
</html>
