<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCI DTx – HF 설문 (HTML 실행형)</title>
<!-- Chart.js for Radar -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0b1220;--card:#121a2a;--fg:#eaf2ff;--muted:#9fb3d1;--accent:#7aa2ff;--accent2:#37d6b5;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif}
  .wrap{max-width:960px;margin:24px auto;padding:16px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
  header{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:22px}
  .progress{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.06)}
  .bar{height:10px;background:#24304a;border-radius:6px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--accent),#b388ff);width:0%;transition:width .35s ease}
  .meta{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}
  .stage{padding:20px 24px}
  .qid{display:inline-block;padding:6px 12px;border-radius:999px;background:#1b253a;color:#9fb3d1;font-weight:600;font-size:13px;margin-bottom:14px}
  .qtext{font-size:22px;line-height:1.5;font-weight:700;margin:6px 0 18px}
  .opts{display:flex;flex-wrap:wrap;gap:10px}
  .opt{background:#1a2439;border:2px solid #2a3858;border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:600}
  .opt.selected{border-color:var(--accent);background:#1f2e4e;box-shadow:0 0 0 2px rgba(122,162,255,.15) inset}
  .nav{display:flex;justify-content:space-between;gap:12px;padding:18px 24px;border-top:1px solid rgba(255,255,255,.06)}
  button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
  .ghost{background:#223050;color:#b9c7e6}
  .primary{background:linear-gradient(90deg,var(--accent),#b388ff);color:#0c1235}
  .primary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}
  .hidden{display:none}
  .result{padding:20px 24px}
  .grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
  .panel{background:#0f1626;border:1px solid #27324e;border-radius:12px;padding:16px}
  .panel h3{margin:0 0 8px;font-size:18px}
  .big{font-size:20px}
  .tag{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#1b253a;color:#9fb3d1;font-size:12px}
  .hl{color:#cfe1ff}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app">
    <header>
      <h1>🧠 MCI DTx – HF(개인맞춤) 설문</h1>
      <div class="muted" id="phaseLabel">준비</div>
    </header>

    <div class="progress">
      <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
      <div class="meta">
        <div>단계: <span id="stageName">Intro</span></div>
        <div>진행도: <span id="count">0</span>/<span id="total">0</span></div>
      </div>
    </div>

    <div class="stage" id="stageIntro">
      <div class="qid">HF 안내</div>
      <div class="qtext">당신에게 맞는 <span class="hl">대화방식</span>과 <span class="hl">대화주제</span>를 알아보는 1~5점 문항 검사입니다.<br>문항은 한 번에 하나씩 표시되며, 순서는 무작위입니다.</div>
      <div class="opts"></div>
      <div class="nav">
        <button class="ghost" disabled>← 이전</button>
        <button class="primary" id="startBtn">🟢 상담 시작하기</button>
      </div>
    </div>

    <div class="stage hidden" id="stageQ">
      <div class="qid" id="qid">문항</div>
      <div class="qtext" id="qtext">질문 텍스트</div>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button class="ghost" id="prevBtn">← 이전</button>
        <button class="primary" id="nextBtn" disabled>다음 →</button>
      </div>
    </div>

    <div class="result hidden" id="stageResult">
      <div class="grid">
        <div class="panel">
          <h3>🗣️ 대화 스타일 요약</h3>
          <div class="big" id="styleSummary">-</div>
          <div class="muted" id="styleSub">-</div>
        </div>
        <div class="panel">
          <h3>💭 선호 주제 요약</h3>
          <div class="big" id="topicSummary">-</div>
          <div class="muted" id="topicSub">-</div>
        </div>
        <div class="panel">
          <h3>📈 레이더 차트 – 대화방식</h3>
          <canvas id="styleChart" height="320"></canvas>
        </div>
        <div class="panel">
          <h3>📈 레이더 차트 – 대화주제</h3>
          <canvas id="topicChart" height="320"></canvas>
        </div>
      </div>
      <div class="nav">
        <button class="ghost" id="restartBtn">🔁 다시 시작</button>
        <span></span>
      </div>
    </div>
  </div>
</div>

<script>
/* -----------------------------
   데이터 정의
----------------------------- */
const ANSWERS = ["전혀 아니다","대체로 아니다","보통이다","대체로 그렇다","매우 그렇다"];
const STYLE_TYPES = ["공감형","격려형","논리형","창의형","차분형","직설형"];
const TOPIC_TYPES = ["자기인식","대인관계","회복력","긍정습관","인지기능","마음챙김"];

// 30문항: 대화방식
const STYLE_QUESTIONS = [
  ["상대가 내 감정을 이해해줄 때 마음이 가장 편안하다.","공감형"],
  ["누군가 조언보다 내 이야기를 조용히 들어줄 때 위로가 된다.","공감형"],
  ["감정 표현을 잘 들어주는 사람을 신뢰하게 된다.","공감형"],
  ["대화 중 상대가 '그럴 수 있어요'라고 공감해주면 안도감을 느낀다.","공감형"],
  ["감정이 진심으로 존중받는 느낌이 중요하다.","공감형"],
  ["‘할 수 있다’는 말을 들으면 실제로 의욕이 생긴다.","격려형"],
  ["작은 성취도 인정받을 때 더 노력하고 싶다.","격려형"],
  ["상대의 밝은 톤과 웃음이 나에게도 힘이 준다.","격려형"],
  ["격려와 칭찬이 내 행동을 바꾸는 가장 큰 요인이다.","격려형"],
  ["비판보다 긍정적인 피드백이 훨씬 도움이 된다.","격려형"],
  ["감정 위로보다 문제의 원인을 함께 분석해주는 것이 좋다.","논리형"],
  ["감정적인 이야기보다는 현실적인 조언이 더 도움이 된다.","논리형"],
  ["논리적 근거가 있는 말이 신뢰감을 준다.","논리형"],
  ["대화가 감정적일 때보다 객관적일 때 더 집중된다.","논리형"],
  ["상담자는 따뜻함보다는 이성적인 시각을 유지해야 한다고 생각한다.","논리형"],
  ["감정을 색깔이나 이미지로 표현하면 마음이 편해진다.","창의형"],
  ["상상이나 은유로 이야기하면 감정이 더 잘 풀린다.","창의형"],
  ["예술, 그림, 음악 같은 이야기가 감정 표현에 도움이 된다.","창의형"],
  ["‘만약에’로 시작하는 상상 대화가 흥미롭다.","창의형"],
  ["감정을 창의적인 방식으로 표현하는 상담을 선호한다.","창의형"],
  ["조용하고 천천히 말하는 상담자가 좋다.","차분형"],
  ["말을 급하게 몰아붙이는 대화는 불편하다.","차분형"],
  ["상대가 나를 재촉하지 않을 때 마음이 놓인다.","차분형"],
  ["차분한 분위기에서 감정을 이야기하기가 쉽다.","차분형"],
  ["짧은 침묵이 있어도 어색하지 않게 느껴진다.","차분형"],
  ["돌려 말하지 않고 솔직하게 표현하는 대화를 선호한다.","직설형"],
  ["감정적인 위로보다 현실적인 해결책이 더 낫다.","직설형"],
  ["상대가 단도직입적으로 말해도 기분이 나쁘지 않다.","직설형"],
  ["불편한 사실이라도 바로 지적해주는 것이 좋다.","직설형"],
  ["문제를 직면하게 도와주는 대화가 가장 효과적이라고 생각한다.","직설형"]
];

// 30문항: 대화주제
const TOPIC_QUESTIONS = [
  ["내 감정의 원인을 탐색하는 대화가 도움이 된다.","자기인식"],
  ["내가 왜 이런 기분인지 스스로 이해하는 게 중요하다.","자기인식"],
  ["대화 속에서 내 생각 습관을 돌아볼 때 성장감을 느낀다.","자기인식"],
  ["감정을 억누르기보다 솔직히 표현할 수 있을 때 편하다.","자기인식"],
  ["내 감정을 구체적인 단어로 표현하는 연습이 필요하다고 느낀다.","자기인식"],
  ["사람들과의 관계 이야기를 나누는 게 가장 현실적이다.","대인관계"],
  ["관계 갈등을 해결하는 조언이 도움이 된다.","대인관계"],
  ["내 인간관계 패턴을 분석해보는 것이 흥미롭다.","대인관계"],
  ["가족, 친구, 동료와의 관계를 되돌아보는 시간이 필요하다.","대인관계"],
  ["사회적 소속감이나 유대감에 대한 이야기가 마음을 안정시킨다.","대인관계"],
  ["힘든 경험을 어떻게 이겨낼지 이야기할 때 위로가 된다.","회복력"],
  ["실패나 후회를 재해석하는 대화를 좋아한다.","회복력"],
  ["역경 속에서도 성장할 수 있다는 이야기가 힘이 된다.","회복력"],
  ["문제를 극복한 사례나 전략을 듣는 게 도움이 된다.","회복력"],
  ["‘다시 시작할 수 있다’는 메시지를 자주 듣고 싶다.","회복력"],
  ["운동이나 수면 습관처럼 일상 루틴을 다루는 대화가 좋다.","긍정습관"],
  ["작은 목표라도 꾸준히 실천하는 방법에 관심이 있다.","긍정습관"],
  ["생활습관 개선을 위한 실질적인 조언이 필요하다.","긍정습관"],
  ["계획 세우기나 시간 관리에 관한 이야기가 유익하다.","긍정습관"],
  ["규칙적인 생활이 마음의 안정을 가져온다고 느낀다.","긍정습관"],
  ["기억력이나 집중력을 향상시키는 훈련에 흥미가 있다.","인지기능"],
  ["퍼즐이나 언어 문제처럼 생각을 자극하는 과제가 좋다.","인지기능"],
  ["뇌 건강이나 인지 기능 관련 이야기를 자주 듣고 싶다.","인지기능"],
  ["인지 기능 향상이 삶의 질에 직접적인 영향을 준다고 믿는다.","인지기능"],
  ["단순한 대화보다 생각을 요하는 질문이 더 흥미롭다.","인지기능"],
  ["호흡이나 명상을 주제로 한 대화가 도움이 된다.","마음챙김"],
  ["지금 이 순간에 집중하는 연습이 나에게 맞는다.","마음챙김"],
  ["마음의 평화를 찾는 주제의 이야기를 좋아한다.","마음챙김"],
  ["감각(냄새, 소리, 빛 등)을 인식하는 대화가 안정감을 준다.","마음챙김"],
  ["불안하거나 긴장될 때 마음챙김이 효과적이라고 느낀다.","마음챙김"]
];

/* -----------------------------
   상태 & 유틸
----------------------------- */
let phase = "intro";            // intro -> style -> topic -> result
let orderStyle = [];            // 랜덤 순서 (인덱스 배열)
let orderTopic = [];
let idx = 0;                    // 현재 문항 인덱스(해당 phase 내)
let answersStyle = {};          // { index: 1~5 }
let answersTopic = {};
const $ = (id)=>document.getElementById(id);

const answerToScore = (label)=> ANSWERS.indexOf(label)+1; // 1~5

function shuffle(n){ const arr=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]} return arr; }

function setPhase(p){
  phase = p;
  $("phaseLabel").textContent = (p==="style"?"대화방식":p==="topic"?"대화주제":p==="result"?"결과":"준비");
  $("stageName").textContent = (p==="style"?"Style":p==="topic"?"Topic":p==="result"?"Result":"Intro");
  $("stageIntro").classList.toggle("hidden", p!=="intro");
  $("stageQ").classList.toggle("hidden", !(p==="style"||p==="topic"));
  $("stageResult").classList.toggle("hidden", p!=="result");

  const total = (p==="style")?orderStyle.length:(p==="topic")?orderTopic.length:0;
  $("total").textContent = total;
  updateProgress();
}

function updateProgress(){
  const total = (phase==="style")?orderStyle.length:(phase==="topic")?orderTopic.length:1;
  const cur = (phase==="style"||phase==="topic") ? idx+1 : total;
  $("count").textContent = (phase==="style"||phase==="topic") ? cur : 0;
  const pct = (phase==="style"||phase==="topic") ? Math.round(cur/total*100) : (phase==="result"?100:0);
  $("fill").style.width = pct+"%";
}

function renderQuestion(){
  const list = (phase==="style")?STYLE_QUESTIONS:TOPIC_QUESTIONS;
  const order = (phase==="style")?orderStyle:orderTopic;
  const [text, cat] = list[order[idx]];
  $("qid").textContent = `${phase==="style"?"대화방식":"대화주제"} ${idx+1}/${order.length}`;
  $("qtext").textContent = text;
  const key = `${phase}_${order[idx]}`;
  const stored = (phase==="style"?answersStyle:answersTopic)[order[idx]];

  const optsHTML = ANSWERS.map(a => {
    const sel = stored===a ? "opt selected" : "opt";
    return `<div class="${sel}" data-val="${a}">${a}</div>`;
  }).join("");
  $("opts").innerHTML = optsHTML;

  // 이벤트 바인딩
  [...document.querySelectorAll("#opts .opt")].forEach(el=>{
    el.addEventListener("click", ()=>{
      [...document.querySelectorAll("#opts .opt")].forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");
      if(phase==="style") answersStyle[order[idx]] = el.dataset.val;
      else answersTopic[order[idx]] = el.dataset.val;
      $("nextBtn").disabled = false;
    });
  });

  // 버튼 상태
  $("prevBtn").disabled = idx===0;
  $("nextBtn").textContent = (idx===order.length-1) ? (phase==="style"?"다음 단계 →":"결과 보기") : "다음 →";
  $("nextBtn").disabled = !stored;

  updateProgress();
}

/* -----------------------------
   점수 계산 & 결과
----------------------------- */
function computeScores(answerMap, list, types){
  const sums = {}; types.forEach(t=>sums[t]=0);
  Object.entries(answerMap).forEach(([i,label])=>{
    const score = answerToScore(label);
    const cat = list[i][1];
    sums[cat] += score;
  });
  return sums; // { 유형: 합계 }
}

function top2(scores){
  const arr = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  return [arr[0]||[null,0], arr[1]||[null,0]];
}

let styleChart, topicChart;
function showResult(){
  const styleScores = computeScores(answersStyle, STYLE_QUESTIONS, STYLE_TYPES);
  const topicScores = computeScores(answersTopic, TOPIC_QUESTIONS, TOPIC_TYPES);
  const [s1,s2] = top2(styleScores);
  const [t1,t2] = top2(topicScores);

  $("styleSummary").innerHTML = s1[0] ? `주성향: <b>${s1[0]}</b><span class="tag">보조: ${s2[0]||"-"}</span>` : "-";
  $("topicSummary").innerHTML = t1[0] ? `주성향: <b>${t1[0]}</b><span class="tag">보조: ${t2[0]||"-"}</span>` : "-";
  $("styleSub").textContent = explainStyle(s1[0]);
  $("topicSub").textContent = explainTopic(t1[0]);

  // 차트
  const styleVals = STYLE_TYPES.map(t=>styleScores[t]||0);
  const topicVals = TOPIC_TYPES.map(t=>topicScores[t]||0);

  const radarCfg = (labels, data, color)=>({
    type:'radar',
    data:{ labels, datasets:[{label:'점수', data, fill:true, borderColor:color, backgroundColor:hexToRgba(color,.25), pointRadius:3}] },
    options:{
      responsive:true,
      scales:{ r:{ beginAtZero:true, suggestedMax:25, grid:{color:'#2b395a'}, angleLines:{color:'#2b395a'}, pointLabels:{color:'#d8e4ff', font:{size:12}} } },
      plugins:{ legend:{display:false} }
    }
  });

  if(styleChart) styleChart.destroy();
  if(topicChart) topicChart.destroy();
  styleChart = new Chart($("styleChart"), radarCfg(STYLE_TYPES, styleVals, '#7aa2ff'));
  topicChart = new Chart($("topicChart"), radarCfg(TOPIC_TYPES, topicVals, '#37d6b5'));

  setPhase("result");
}

function hexToRgba(hex, alpha){
  const m = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
  if(!m) return hex;
  const r = parseInt(m[1],16), g=parseInt(m[2],16), b=parseInt(m[3],16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function explainStyle(key){
  const map={
    "공감형":"감정을 이해받고 위로받는 대화를 선호합니다.",
    "격려형":"긍정적인 피드백과 응원이 당신의 동기를 자극합니다.",
    "논리형":"문제의 원인을 분석하고 논리적으로 정리할 때 편안합니다.",
    "창의형":"상상과 비유, 예술적 접근으로 감정을 풀어내는 것을 선호합니다.",
    "차분형":"조용하고 안정적인 분위기에서 생각을 정리할 때 집중이 잘 됩니다.",
    "직설형":"솔직하고 현실적인 조언을 선호합니다. 명확한 해결 중심 대화가 맞습니다."
  };
  return map[key]||"-";
}
function explainTopic(key){
  const map={
    "자기인식":"감정과 생각을 탐색하며 자기이해를 높이는 대화에 몰입합니다.",
    "대인관계":"관계를 풀어가며 타인과의 소통을 중시합니다.",
    "회복력":"역경을 재해석하고 다시 일어설 힘을 얻는 대화를 선호합니다.",
    "긍정습관":"작은 습관을 꾸준히 실천해 변화를 만드는 것을 중시합니다.",
    "인지기능":"기억력·집중력 향상 등 인지적 훈련형 대화에 관심이 많습니다.",
    "마음챙김":"이완과 명상을 통해 정서적 안정과 평화를 추구합니다."
  };
  return map[key]||"-";
}

/* -----------------------------
   이벤트 바인딩
----------------------------- */
$("startBtn").addEventListener("click", ()=>{
  orderStyle = shuffle(STYLE_QUESTIONS.length);
  orderTopic = shuffle(TOPIC_QUESTIONS.length);
  answersStyle = {}; answersTopic={}; idx=0;
  setPhase("style");
  renderQuestion();
});

$("prevBtn").addEventListener("click", ()=>{
  if(idx>0){ idx--; renderQuestion(); }
});

$("nextBtn").addEventListener("click", ()=>{
  const order = (phase==="style")?orderStyle:orderTopic;
  if(idx < order.length-1){
    idx++; renderQuestion();
  }else{
    if(phase==="style"){ // 다음 단계로
      idx=0; setPhase("topic"); renderQuestion();
    }else{
      showResult();
    }
  }
});

$("restartBtn").addEventListener("click", ()=>{
  setPhase("intro");
  $("fill").style.width = "0%";
});

/* 초기 라벨 */
setPhase("intro");
</script>
